  pull_request: 130
  pr_head: b253dc48f9d297786df60d4389552752ccfb65da
  commit: 4c626a73cc38308227b5c28e75558b3da574312b
  defconfig: configs/a71_defconfig
  board_file: board/samsung/board-a71.c
  license_reported: GPL-2.0
  license_origin: github_api
  license_spdx_status: TODO_VERIFIER
  signature_status: unsigned
  validation_status: provisional

# DTB Android : fourni par l'utilisateur (image boot Android/LineageOS de son
# propre SM-A715F). Aucun telechargement, aucune extraction automatique.
android_dtb:
  source: user_provided_boot_image
  validation_status: TODO_VERIFIER

