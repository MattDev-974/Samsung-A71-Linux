# Parametres de l'image boot : les valeurs du nouveau pipeline doivent venir
# UNIQUEMENT de boot_image.validated.*. Les valeurs legacy_observed.* sont
# conservees pour la tracabilite et ne doivent jamais etre consommees.
boot_image:
  validation_status: TODO_VERIFIER
  validated:
    header_version: TODO_VERIFIER
    page_size: TODO_VERIFIER
    kernel_addr: TODO_VERIFIER
    ramdisk_addr: TODO_VERIFIER
    tags_addr: TODO_VERIFIER
    dtb_addr: TODO_VERIFIER
    cmdline: TODO_VERIFIER
    boot_partition_size: TODO_VERIFIER
  legacy_observed:
    origin: ancien scripts/mkbootimg.py et ancien dist/boot.img
    status: historique, non valide pour le nouveau pipeline
    header_version: 2
    page_size: 4096
    kernel_addr: 0x8000
    ramdisk_addr: 0x1000000
    tags_addr: 0x100
    dtb_addr: 0x1f00000
    cmdline: console=tty0 console=ttyMSM0,115200n8 consoleblank=0 loglevel=7

# Politique USB : le reseau USB n'est PAS garanti avant le montage de la
# racine (aucun contrat d'inclusion des modules dans l'initramfs).
usb_policy:
  early_usb_recovery_status: not_implemented
  network_before_root: not_guaranteed
  module_policy: chargeable_apres_montage

# Rootfs : contrats d'acquisition et d'extraction implementes. Les resultats
# locaux (hash recalcule, chemins, dates) restent dans work/rootfs/.
rootfs:
  acquisition_contract_status: implemented
  extraction_contract_status: implemented
  module_integration_contract_status: implemented
  depmod_contract_status: implemented
  runtime_status: not_tested
  validation_status: provisional

storage:
  root_label: A71ROOT
  root_filesystem: ext4
